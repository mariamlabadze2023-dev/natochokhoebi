<!-- SUPABASE CONCERTS -->

<script>


// ======================================
// SUPABASE CONFIGURATION
// ======================================

const SUPABASE_URL =
    "https://topngtylgfdikvmxvgbw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_t7UOrsX9MTxUnDE_-hyafQ_OFvQpvnn";


// ======================================
// LOAD CONCERTS
// ======================================

async function loadUpcomingConcerts() {

    const container =
        document.getElementById(
            "concertsContainer"
        );


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/concerts?select=*&status=eq.available",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Failed to load concerts"
            );

        }


        const concerts =
            await response.json();


        // თუ კონცერტები არ არის

        if (
            !concerts ||
            concerts.length === 0
        ) {

            container.innerHTML = `

                <p class="no-concerts">

                    ამ ეტაპზე დაგეგმილი კონცერტები არ არის.

                </p>

            `;

            return;

        }


        // კონტეინერის გასუფთავება

        container.innerHTML = "";


        // ყველა კონცერტის შექმნა

        concerts.forEach(
            concert => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "concert-card";


                card.innerHTML = `

                    <img
                        src="${concert.image}"
                        alt="${concert.title}"
                        onerror="this.src='./images/natushki.jpeg'"
                    >


                    <span class="status available">
                        Available
                    </span>


                    <h2>
                        ${concert.title}
                    </h2>


                    <p>
                        📅 ${concert.date}
                    </p>


                    <p>
                        📍 ${concert.location}
                    </p>

                `;


                container.appendChild(
                    card
                );


            }
        );


    } catch (error) {

        console.error(
            "Error:",
            error
        );


        container.innerHTML = `

            <p class="no-concerts">

                კონცერტების ჩატვირთვა ვერ მოხერხდა.

            </p>

        `;

    }

}


// ======================================
// LOAD WHEN PAGE OPENS
// ======================================

document.addEventListener(
    "DOMContentLoaded",
    loadUpcomingConcerts
);


</script>
